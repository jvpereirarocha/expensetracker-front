name: CI/CD - Front Fintracker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: jvrochadev/front-fintracker
  NODE_VERSION: "22"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installing dependencies
        run: npm ci

      # ESLint is not run yet: the codebase still has vue/no-mutating-props errors.
      - name: Lint (oxlint)
        run: npx oxlint .

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

  # Order matters: the image is pushed BEFORE the release commit bumps newTag
  # in k8s/kustomization.yaml, so ArgoCD never syncs a tag that does not exist yet.
  release:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SEMREL: >-
        npx --yes
        -p semantic-release@24.2.3
        -p @semantic-release/exec@6.0.3
        -p @semantic-release/git@10.0.1
        semantic-release
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Compute next version (dry run)
        id: next
        run: |
          $SEMREL --dry-run
          if [ -f .next-version ]; then
            echo "version=$(cat .next-version)" >> "$GITHUB_OUTPUT"
            rm .next-version
          fi

      - name: Docker Hub authentication
        if: steps.next.outputs.version != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        if: steps.next.outputs.version != ''
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.next.outputs.version != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.next.outputs.version }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Bumps newTag, commits it, tags vX.Y.Z and creates the GitHub release.
      # ArgoCD then syncs the new tag to the cluster.
      - name: Release
        if: steps.next.outputs.version != ''
        run: $SEMREL
